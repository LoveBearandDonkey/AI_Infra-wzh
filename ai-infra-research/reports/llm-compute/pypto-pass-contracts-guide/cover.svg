<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 540"><rect width="800" height="540" fill="#131313"/><style>svg text{font-family:Inter,"PingFang SC",system-ui,sans-serif;fill:#e8e8e8;font-size:18px}
svg .small{font-size:14px;fill:#ababab}
svg .tiny{font-size:12px;fill:#ababab}
svg .op-label{font-size:18px;font-weight:650;fill:#fff;dominant-baseline:middle}
svg .hit{cursor:pointer}
svg .hit .outline{transition:stroke .12s}
svg .hit:hover .outline,svg .hit.selected .outline,svg .hit:focus .outline{stroke:#fff;stroke-width:2.5}
svg .hit.selected text{fill:#fff}
svg .hit:focus{outline:none}
svg .data-label{paint-order:stroke;stroke:#131313;stroke-width:2.5px;stroke-linejoin:round}
svg .grid-label{font-size:14px;fill:var(--tensor-color);font-weight:400}
svg .grid-detail{font-size:12px;fill:var(--tensor-color);font-weight:400}
svg .hit.selected .data-label text{fill:var(--tensor-color)}
svg .edge-label{font-size:12px;fill:#ccc;paint-order:stroke;stroke:#131313;stroke-width:5px}
svg .soft{opacity:.24}
svg .hit.selected{opacity:1}
svg .hit[data-key="task"]{--object-color:#685CF0}
svg .hit[data-key="loop"]{--object-color:#685CF0}
svg .hit[data-key="loop"]>path{stroke:#685CF0}
svg .hit[data-key="loop"]>text{fill:#685CF0}
svg .hit[data-key="buffer"],svg .hit[data-key="address"]{--object-color:#C7AD88}
svg .hit[data-key="pass"],svg .hit[data-key="snapshot"]{--object-color:#aaa}
svg .hit[data-key="callable"]>.outline,svg .hit[data-key="loop"]>.outline,svg .hit[data-key="task"]>.outline,svg .hit[data-key="buffer"]>.outline,svg .hit[data-key="address"]>.outline,svg .hit[data-key="pass"]>.outline,svg .hit[data-key="snapshot"]>.outline{stroke:var(--object-color);stroke-width:1.3}
svg .hit[data-key="callable"]>text,svg .hit[data-key="loop"]>text,svg .hit[data-key="task"]>text,svg .hit[data-key="buffer"]>text,svg .hit[data-key="address"]>text,svg .hit[data-key="pass"]>text,svg .hit[data-key="snapshot"]>text{fill:var(--object-color)}
svg .hit[data-key="task"]>.outline{fill:#211C3C}
svg .hit[data-key="buffer"]>.outline{fill:#25221D}
svg .hit[data-key="pass"]>.outline,svg .hit[data-key="snapshot"]>.outline{fill:#202020}
svg .hit[data-key="callable"]>path{stroke:#8EAED0;stroke-opacity:.3}
svg .hit[data-key="buffer"]>path{stroke:#C7AD88;stroke-opacity:.45}
svg .hit[data-key="address"]>rect{fill:#C7AD88;fill-opacity:.17;stroke:#C7AD88;stroke-width:1.2}
svg .hit:hover>.outline,svg .hit.selected>.outline,svg .hit:focus>.outline{stroke-width:2;stroke:var(--object-color,#fff)}
svg .symbol .outline{stroke:#B9C2CD;stroke-width:1.5;fill:#1A1E23}
svg .symbol.selected .outline,svg .symbol:hover .outline,svg .symbol:focus .outline{stroke:#fff;stroke-width:2}
svg .hit[data-key="kernel"]{--object-color:#685CF0}
svg .hit[data-key="kernel"]>text{fill:#CEC4F9}
svg .hit[data-key="op"]{--object-color:#685CF0}
svg .cell-title{font-size:16px;font-weight:600;fill:#eee}</style><defs><linearGradient id="op-purple" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#4D3BC9"/><stop offset="1" stop-color="#3D2DC0"/></linearGradient><marker id="arrow" viewBox="0 0 14 14" refX="12" refY="7" markerWidth="10" markerHeight="10" orient="auto"><path d="M8 7 H12" stroke="#131313" stroke-width="2.5"/><path d="M3 2 L8 7 L3 12 M7 2 L12 7 L7 12" stroke="#E8E8E8" stroke-width="1.4" stroke-linejoin="miter" fill="none"/></marker><marker id="open" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1 L9 5 L1 9" stroke="#ccc" stroke-width="1.5" fill="none"/></marker><marker id="diamond" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="9" markerHeight="9" orient="auto"><path d="M1 6 L6 1 L11 6 L6 11Z" fill="#131313" stroke="#aaa"/></marker><marker id="circle" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><circle cx="5" cy="5" r="3" fill="#131313" stroke="#aaa"/></marker></defs><g class="hit" tabindex="0" role="button" aria-label="阶段 IR · 程序结构" data-key="snapshot" data-layer="program"><path class="outline" d="M80 178 V240 M242 178 V240" fill="none" stroke="#aaa"/><text x="161" y="165" class="small" text-anchor="middle">Pass 前 IR</text><path d="M127 192 H146 V208 H160 M127 224 H146 V208 M210 208 H231" fill="none" stroke="#aaa" stroke-width="1.3"/><path d="M156 205 L160 208 L156 211 M227 205 L231 208 L227 211" fill="none" stroke="#aaa"/><rect data-ir-kind="tensor" x="90" y="182" width="37" height="20" rx="4" fill="#242424" stroke="#aaa" stroke-width="1.1"/><text x="108.5" y="196" class="tiny" text-anchor="middle">X</text><rect data-ir-kind="tensor" x="90" y="214" width="37" height="20" rx="4" fill="#242424" stroke="#aaa" stroke-width="1.1"/><text x="108.5" y="228" class="tiny" text-anchor="middle">W</text><rect data-ir-kind="op" x="160" y="198" width="50" height="20" rx="10" fill="#685CF0" stroke="#685CF0" stroke-width="1.1"/><text x="185" y="212" class="tiny" text-anchor="middle">op</text></g><g class="hit" tabindex="0" role="button" aria-label="Pass · 编译处理步骤" data-key="pass" data-layer="program"><rect class="outline" x="310" y="180" width="260" height="36" rx="3" fill="#252525" stroke="#656565"/><text x="440" y="203" class="small" text-anchor="middle">受契约约束的变换</text></g><g class="hit" tabindex="0" role="button" aria-label="阶段 IR · 程序结构" data-key="snapshot" data-layer="program"><path class="outline" d="M610 178 V240 M772 178 V240" fill="none" stroke="#aaa"/><text x="691" y="165" class="small" text-anchor="middle">Pass 后 IR</text><path d="M657 192 H676 V208 H690 M657 224 H676 V208 M740 208 H761" fill="none" stroke="#aaa" stroke-width="1.3"/><path d="M686 205 L690 208 L686 211 M757 205 L761 208 L757 211" fill="none" stroke="#aaa"/><rect data-ir-kind="tensor" x="620" y="182" width="37" height="20" rx="4" fill="#242424" stroke="#aaa" stroke-width="1.1"/><text x="638.5" y="196" class="tiny" text-anchor="middle">X</text><rect data-ir-kind="tensor" x="620" y="214" width="37" height="20" rx="4" fill="#242424" stroke="#aaa" stroke-width="1.1"/><text x="638.5" y="228" class="tiny" text-anchor="middle">W</text><rect data-ir-kind="op" x="690" y="198" width="50" height="20" rx="10" fill="#685CF0" stroke="#685CF0" stroke-width="1.1"/><text x="715" y="212" class="tiny" text-anchor="middle">op</text></g><g class="hit" tabindex="0" role="button" aria-label="跨阶段 IR 对应 ⋯◇" data-key="mapping" data-layer=""><path class="outline edge" d="M242 210 L310 210" fill="none" stroke="#aaa" stroke-width="1.7" stroke-linejoin="round" stroke-dasharray="3 6" marker-end="url(#diamond)"/><path d="M242 210 L310 210" fill="none" stroke="transparent" stroke-width="12"/></g><g class="hit" tabindex="0" role="button" aria-label="跨阶段 IR 对应 ⋯◇" data-key="mapping" data-layer=""><path class="outline edge" d="M570 210 L610 210" fill="none" stroke="#aaa" stroke-width="1.7" stroke-linejoin="round" stroke-dasharray="3 6" marker-end="url(#diamond)"/><path d="M570 210 L610 210" fill="none" stroke="transparent" stroke-width="12"/></g><g class="hit" tabindex="0" role="button" data-key="contract" aria-label="Pass 性质契约"><rect class="outline" x="145" y="345" width="510" height="100" rx="4" fill="#202020" stroke="#707070"/><text x="400" y="373" class="" text-anchor="middle">同一性质的入口与出口检查</text><text x="400" y="399" class="small" text-anchor="middle">缩小首次可观测偏离范围</text></g></svg>